name: hux_app
description: HUX — daily wellness readouts from your health data. Numbers -> Meaning -> Action.
publish_to: none
# version: <name>+<build>. Bump the build number (+N) for EVERY store upload.
version: 1.0.0+1

environment:
  # flutter_local_notifications 21+ needs Flutter 3.38.1 / Dart 3.10.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  fl_chart: ^0.66.2
  health: ^13.3.1
  google_fonts: ^6.3.2
  supabase_flutter: ^2.15.4
  image_picker: ^1.1.2
  image: ^4.2.0
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  # Tap-to-call help numbers (112, 108, Tele-MANAS) in coach chat.
  url_launcher: ^6.3.1
  # "Download my data" (DPDP right to a copy): share the JSON export.
  share_plus: ^10.1.4
  # Cycle lock: Face ID / fingerprint / phone PIN (Cycle settings).
  local_auth: ^2.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  # Launch screen generator (build-time only):
  #   dart run flutter_native_splash:create
  # App icons are NOT generated: they come from the brand kit and live
  # directly in ios/ and android/ (iOS light/dark/tinted need that).
  # See docs/release/BRANDING.md.
  flutter_native_splash: ^2.4.6

# Launch screen — the aurora with the glass-charge mark, centred. The
# Flutter intro (lib/widgets/hux_intro.dart) starts from exactly this
# frame, so the hand-over is invisible.
flutter_native_splash:
  color: "#1A0B30"
  background_image: assets/splash/splash_bg.png
  image: assets/splash/splash_mark.png
  android_12:
    color: "#1A0B30"
    image: assets/splash/splash_android12.png
  ios_content_mode: center
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/modes/
    - assets/images/moves/
    - assets/images/brand/
    - assets/splash/splash_bg.png
