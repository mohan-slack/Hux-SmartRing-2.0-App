name: hux_app
description: HUX — daily wellness readouts from your health data. Numbers -> Meaning -> Action.
publish_to: none
# version: <name>+<build>. Bump the build number (+N) for EVERY store upload.
version: 1.0.0+1

environment:
  # flutter_local_notifications 21+ needs Flutter 3.38.1 / Dart 3.10.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  fl_chart: ^0.66.2
  health: ^13.3.1
  google_fonts: ^6.3.2
  supabase_flutter: ^2.15.4
  image_picker: ^1.1.2
  image: ^4.2.0
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  # Tap-to-call help numbers (112, 108, Tele-MANAS) in coach chat.
  url_launcher: ^6.3.1
  # "Download my data" (DPDP right to a copy): share the JSON export.
  share_plus: ^10.1.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  # Branding generators (build-time only, not in the app):
  #   python3 tool/generate_brand_assets.py
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# App icon — iOS (all sizes, no alpha) + Android legacy, adaptive and
# Android 13 themed (monochrome) icons. Masters come from
# tool/generate_brand_assets.py. See docs/release/BRANDING.md.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

# Launch screen — light (HuxColors.bg) with the dark wordmark, on iOS,
# Android ≤11 and the Android 12+ splash API.
flutter_native_splash:
  color: "#F6F4FA"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#F6F4FA"
    image: assets/splash/splash_android12.png
    icon_background_color: "#F6F4FA"
  ios_content_mode: center
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/modes/
    - assets/images/brand/
